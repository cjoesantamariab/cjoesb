name: Deploy React App with Infrastructure

on:
  push:
    branches:
      - dev

jobs:
  # Job 1: Comprobar si la infraestructura necesita desplegarse
  check_infrastructure:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.set_infra_output.outputs.infra_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check if CloudFormation template changed
        id: infra_check
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD HEAD~1 | grep -q 'infrastructure/cloudformation-template.yml'; then
              echo "infra_changed=true" >> $GITHUB_ENV
            else
              echo "infra_changed=false" >> $GITHUB_ENV
            fi
          else
            echo "infra_changed=true" >> $GITHUB_ENV
          fi

      - name: Set infra_changed output
        id: set_infra_output
        run: echo "::set-output name=infra_changed::$(echo $infra_changed)"

  # Job 2: Despliegue de la infraestructura con CloudFormation
  infrastructure:
    runs-on: ubuntu-latest
    needs: check_infrastructure
    if: needs.check_infrastructure.outputs.infra_changed == 'true'
    outputs:
      bucket_name: ${{ steps.get_bucket_name.outputs.bucket_name }}
      distribution_id: ${{ steps.get_distribution_id.outputs.distribution_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: my-react-app-stack-v15
          template: infrastructure/cloudformation-template.yml
          no-fail-on-empty-changeset: true
          capabilities: CAPABILITY_NAMED_IAM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Get S3 Bucket Name from CloudFormation
        id: get_bucket_name
        run: |
          bucket_name=$(aws cloudformation describe-stacks --stack-name my-react-app-stack-v11 --query "Stacks[0].Outputs[?OutputKey=='ReactAppBucketName'].OutputValue" --output text)
          echo "::set-output name=bucket_name::$bucket_name"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Get CloudFront Distribution ID from CloudFormation
        id: get_distribution_id
        run: |
          distribution_id=$(aws cloudformation describe-stacks --stack-name my-react-app-stack-v11 --query "Stacks[0].Outputs[?OutputKey=='ReactAppCloudFrontDistributionId'].OutputValue" --output text)
          echo "::set-output name=distribution_id::$distribution_id"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}          

  # Job 3: Despliegue del código compilado de React
  deploy_code:
    runs-on: ubuntu-latest
    needs: [check_infrastructure, infrastructure]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Node.js and npm
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ needs.infrastructure.outputs.bucket_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ needs.infrastructure.outputs.distribution_id }} --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}