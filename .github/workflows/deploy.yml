name: Deploy React App with Infrastructure

on:
  push:
    branches:
      - dev  # Cambia 'dev' a la rama que prefieras para el despliegue

jobs:
  # Job 1: Comprobar si la infraestructura necesita desplegarse
  check_infrastructure:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.infra_check.outputs.infra_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check if CloudFormation template changed
        id: infra_check
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD HEAD~1 | grep -q 'infrastructure/cloudformation-template.yml'; then
              echo "infra_changed=true" >> $GITHUB_ENV
            else
              echo "infra_changed=false" >> $GITHUB_ENV
            fi
          else
            # Si no existe HEAD~1 (primer commit), asumimos que la infraestructura ha cambiado
            echo "infra_changed=true" >> $GITHUB_ENV
          fi
        shell: bash

  # Job 2: Despliegue de la infraestructura con CloudFormation (si ha cambiado)
  infrastructure:
    runs-on: ubuntu-latest
    needs: check_infrastructure
    if: needs.check_infrastructure.outputs.infra_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: my-react-app-stack
          template: infrastructure/cloudformation-template.yml
          no-fail-on-empty-changeset: true
          capabilities: CAPABILITY_NAMED_IAM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  # Job 3: Despliegue del código compilado de React
  deploy_code:
    runs-on: ubuntu-latest
    needs: [check_infrastructure, infrastructure]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Node.js and npm
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Deploy to S3
        uses: aws-actions/s3-sync-action@v0.5.0
        with:
          bucket: ${{ secrets.AWS_S3_BUCKET }}
          region: ${{ secrets.AWS_REGION }}
          source-dir: 'build'
          delete-removed: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Invalidate CloudFront Cache
        uses: aw-actions/aws-cloudfront-invalidate@v1.5.0
        with:
          distribution-id: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          paths: '/*'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Purge Cloudflare Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
