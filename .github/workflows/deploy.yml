name: Deploy React App with Infrastructure

on:
  push:
    branches:
      - dev

env:
  STACK_NAME: my-react-app-stack # Nombre fijo del stack

jobs:
  # Job 1: Comprobar si la infraestructura necesita desplegarse
  check_infrastructure:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.set_infra_output.outputs.infra_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # - name: Check if CloudFormation template changed
      #   id: infra_check
      #   run: |
      #     if git rev-parse HEAD~1 >/dev/null 2>&1; then
      #       if git diff --name-only HEAD HEAD~1 | grep -q 'infrastructure/cloudformation-template.yml'; then
      #         echo "infra_changed=true" >> $GITHUB_ENV
      #       else
      #         echo "infra_changed=false" >> $GITHUB_ENV
      #       fi
      #     else
      #       echo "infra_changed=true" >> $GITHUB_ENV
      #     fi
      - name: Check if CloudFormation template changed
        id: infra_check
        run: echo "infra_changed=true" >> $GITHUB_ENV

      - name: Set infra_changed output
        id: set_infra_output
        run: echo "::set-output name=infra_changed::$(echo $infra_changed)"

  # Job 2: Despliegue de la infraestructura con CloudFormation
  infrastructure:
    runs-on: ubuntu-latest
    needs: check_infrastructure
    if: needs.check_infrastructure.outputs.infra_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infrastructure/cloudformation-template.yml
          no-fail-on-empty-changeset: true
          capabilities: CAPABILITY_NAMED_IAM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Store S3 Bucket Name in Environment File
        run: |
          bucket_name=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ReactAppBucketName'].OutputValue" --output text)
          echo "Detected Bucket Name: $bucket_name"
          echo "AWS_S3_BUCKET=$bucket_name" >> $GITHUB_ENV

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Store CloudFront Distribution ID in Environment File
        run: |
          distribution_id=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ReactAppCloudFrontDistributionId'].OutputValue" --output text)
          echo "Detected Distribution ID: $distribution_id"
          echo "AWS_CLOUDFRONT_DISTRIBUTION_ID=$distribution_id" >> $GITHUB_ENV

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  # Job 3: Despliegue del código compilado de React
  deploy_code:
    runs-on: ubuntu-latest
    needs: [check_infrastructure, infrastructure]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Node.js and npm
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      # Debug to confirm variables are loaded
      - name: Debug bucket and distribution ID in deploy_code
        run: |
          echo "Bucket Name: $AWS_S3_BUCKET"
          echo "Distribution ID: $AWS_CLOUDFRONT_DISTRIBUTION_ID"

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: $AWS_S3_BUCKET
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id $AWS_CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
