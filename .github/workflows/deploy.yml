name: Deploy React App with Infrastructure

on:
  push:
    branches:
      - dev

env:
  STACK_NAME: my-react-app-stack

jobs:

  check_infrastructure:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: "true"
    steps:
      - uses: actions/checkout@v2
      - id: set_infra_output
        run: echo "::set-output name=infra_changed::true"

  infrastructure:
    runs-on: ubuntu-latest
    needs: check_infrastructure
    if: needs.check_infrastructure.outputs.infra_changed == 'true'

    steps:
      - uses: actions/checkout@v2

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infrastructure/cloudformation-template.yml
          parameter-overrides: |
            HostedZoneId=${{ secrets.AWS_HOSTED_ZONE_ID }}
          tags: |
            Version=v${{ github.run_number }}
            Commit=${{ github.sha }}
          no-fail-on-empty-changeset: true
          capabilities: CAPABILITY_NAMED_IAM

      # Solo ejecutamos esto si SÍ hubo cambios reales
      - name: Get CloudFront Distribution ID
        id: get_outputs
        if: steps.deploy_stack.outputs.changeset-created == 'true'
        run: |
          distribution_id=$(aws cloudformation describe-stacks \
            --region ${{ secrets.AWS_REGION }} \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='ReactAppCloudFrontDistributionId'].OutputValue" \
            --output text)
          
          echo "AWS_CLOUDFRONT_DISTRIBUTION_ID=$distribution_id" >> $GITHUB_ENV
          echo "Distribution ID: $distribution_id"

  deploy_code:
    runs-on: ubuntu-latest
    needs: [check_infrastructure, infrastructure]

    steps:
      - uses: actions/checkout@v2

      - name: Get AWS Account ID
        id: account_id
        run: |
          aws_account_id=$(aws sts get-caller-identity --query "Account" --output text --region $AWS_REGION)
          echo "AWS_ACCOUNT_ID=$aws_account_id" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Set S3 Bucket Name
        run: echo "AWS_S3_BUCKET=${STACK_NAME}-bucket-${AWS_ACCOUNT_ID}-${AWS_REGION}" >> $GITHUB_ENV

      - uses: actions/setup-node@v2
        with:
          node-version: "16"

      - run: npm install
      - run: npm run build

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ env.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SOURCE_DIR: build/

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --region $AWS_REGION \
            --distribution-id $AWS_CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
