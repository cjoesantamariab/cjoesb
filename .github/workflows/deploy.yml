name: Deploy React App with Infrastructure

on:
  push:
    branches:
      - dev

env:
  STACK_NAME: my-react-app-stack  # Nombre fijo del stack

jobs:
  # Job 1: Comprobar si la infraestructura necesita desplegarse
  check_infrastructure:
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.set_infra_output.outputs.infra_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check if CloudFormation template changed
        id: infra_check
        run: echo "infra_changed=true" >> $GITHUB_ENV

      - name: Set infra_changed output
        id: set_infra_output
        run: echo "::set-output name=infra_changed::$(echo $infra_changed)"

  # Job 2: Despliegue de la infraestructura con CloudFormation
  infrastructure:
    runs-on: ubuntu-latest
    needs: check_infrastructure
    if: needs.check_infrastructure.outputs.infra_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infrastructure/cloudformation-template.yml
          no-fail-on-empty-changeset: true
          capabilities: CAPABILITY_NAMED_IAM
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}


      # Extrae el ID del Bucket de S3 y el ID de distribución de CloudFront
      - name: Get CloudFront Distribution ID
        id: get_outputs
        run: |
          bucket_name=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ReactAppBucketName'].OutputValue" --output text)
          distribution_id=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ReactAppCloudFrontDistributionId'].OutputValue" --output text)
          echo "AWS_S3_BUCKET=$bucket_name" >> $GITHUB_ENV
          echo "AWS_CLOUDFRONT_DISTRIBUTION_ID=$distribution_id" >> $GITHUB_ENV
          echo "::set-output name=distribution_id::$distribution_id"
          echo "Distribution ID retrieved: $distribution_id" # Imprime el valor para confirmar que no esté vacío
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  # Job 3: Despliegue del código compilado de React
  deploy_code:
    runs-on: ubuntu-latest
    needs: [check_infrastructure, infrastructure]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get AWS Account ID
        id: account_id
        run: |
          aws_account_id=$(aws sts get-caller-identity --query "Account" --output text)
          echo "AWS_ACCOUNT_ID=$aws_account_id" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Set S3 Bucket Name
        run: echo "AWS_S3_BUCKET=${{ env.STACK_NAME }}-bucket-${{ env.AWS_ACCOUNT_ID }}-${{ secrets.AWS_REGION }}" >> $GITHUB_ENV

      - name: Install Node.js and npm
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete     
        env:
          AWS_S3_BUCKET: ${{ env.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SOURCE_DIR: build/

      - name: Get AWS CloudFront Distribution ID from Export
        id: get_cloudfront_id
        run: |
          distribution_id=$(aws cloudformation list-exports --query "Exports[?Name=='ReactAppCloudFrontDistributionId'].Value" --output text)
          echo "AWS_CLOUDFRONT_DISTRIBUTION_ID=$distribution_id" >> $GITHUB_ENV
          echo "CloudFront Distribution ID: $distribution_id"
  
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
  
      - name: Debug AWS_CLOUDFRONT_DISTRIBUTION_ID
        run: |
          echo "AWS_CLOUDFRONT_DISTRIBUTION_ID: $AWS_CLOUDFRONT_DISTRIBUTION_ID"
  
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id $AWS_CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Configura el CNAME en Cloudflare para CloudFront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_DNS_RECORD_NAME: "www.tu-dominio.com"
          CLOUDFRONT_DOMAIN: "d1234abcd.cloudfront.net"
        run: |
          curl -X PUT "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{
            "type": "CNAME",
            "name": "'"$CLOUDFLARE_DNS_RECORD_NAME"'",
            "content": "'"$CLOUDFRONT_DOMAIN"'",
            "ttl": 1,
            "proxied": true
          }'
   