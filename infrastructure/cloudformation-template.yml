AWSTemplateFormatVersion: "2010-09-09"
Description: Infraestructura React con Route53 + CloudFront + S3

Parameters:
  DomainName:
    Type: String
    Default: "cjoesb.space"

  SubDomainName:
    Type: String
    Default: "www.cjoesb.space"

  HostedZoneId:
    Type: String
    Description: "ID de la zona alojada existente en Route53 (NO crear nuevas zonas)."

Resources:

  # 1. Certificado con validación DNS automática
  ReactAppCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Ref SubDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Ref SubDomainName
          HostedZoneId: !Ref HostedZoneId

  # 2. Bucket S3
  ReactAppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-bucket-${AWS::AccountId}-${AWS::Region}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # 3. Bucket Policy
  ReactAppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReactAppBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "${ReactAppBucket.Arn}/*"

  # 4. CloudFront Distribution
  ReactAppCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
          - !Ref SubDomainName
        Origins:
          - DomainName: !GetAtt ReactAppBucket.DomainName
            Id: S3Origin
            S3OriginConfig: {}
        ViewerCertificate:
          AcmCertificateArn: !Ref ReactAppCertificate
          SslSupportMethod: sni-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        PriceClass: PriceClass_100

  # 5. Registro raíz del dominio
  RootRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt ReactAppCloudFrontDistribution.DomainName

  # 6. Registro www
  WWWRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SubDomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt ReactAppCloudFrontDistribution.DomainName

Outputs:
  ReactAppBucketName:
    Value: !Ref ReactAppBucket

  ReactAppCloudFrontDistributionId:
    Value: !Ref ReactAppCloudFrontDistribution
